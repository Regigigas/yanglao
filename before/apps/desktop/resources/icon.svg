<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- 白色光晕效果 -->
  <rect width="512" height="512" rx="96" fill="white" opacity="0.04"/>

  <!-- ===== 老人剪影（白色）===== -->

  <!-- 头部（圆形）-->
  <circle cx="256" cy="128" r="48" fill="white"/>

  <!-- 身体（略微弯腰）-->
  <path d="M198,210 C210,196 235,190 256,190 C277,190 302,196 314,210
           L322,310 L290,310 L272,240 L240,240 L222,310 L190,310 Z"
        fill="white"/>

  <!-- 左腿 -->
  <path d="M205,305 L218,425 L242,425 L252,340 L222,305 Z"
        fill="white" rx="10"/>

  <!-- 右腿 -->
  <path d="M307,305 L294,425 L270,425 L262,340 L290,305 Z"
        fill="white"/>

  <!-- 手杖（右侧）-->
  <!-- 手杖竖杆 -->
  <line x1="322" y1="225" x2="345" y2="425"
        stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- 手杖 T 形握柄 -->
  <line x1="302" y1="220" x2="342" y2="220"
        stroke="white" stroke-width="16" stroke-linecap="round"/>

  <!-- ===== 爱心装饰（右上角）===== -->
  <path d="M385,52
           C385,52 355,36 355,66
           C355,86 385,106 385,106
           C385,106 415,86 415,66
           C415,36 385,52 385,52 Z"
        fill="url(#heartGrad)"/>

  <!-- 爱心高光 -->
  <ellipse cx="373" cy="64" rx="7" ry="5" fill="white" opacity="0.5" transform="rotate(-30,373,64)"/>

  <!-- 底部装饰横条 -->
  <rect x="160" y="452" width="192" height="12" rx="6" fill="white" opacity="0.25"/>
</svg>
