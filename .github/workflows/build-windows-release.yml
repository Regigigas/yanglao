name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: before/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: before
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron runtime
        working-directory: before/apps/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js

      - name: Build Windows installer
        working-directory: before
        run: pnpm build:win

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" before/apps/desktop/release/*.exe before/apps/desktop/release/*.blockmap --clobber
