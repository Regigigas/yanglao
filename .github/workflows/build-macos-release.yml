name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build macOS x64 and arm64
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: before
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: before/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        run: pnpm --filter @yanglao/desktop build

      - name: Package DMG
        run: pnpm --filter @yanglao/desktop exec electron-builder --mac --config electron-builder.config.ts --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanglao-macos
          path: |
            before/apps/desktop/release/*.dmg
            before/apps/desktop/release/*.dmg.blockmap
          if-no-files-found: error

  release:
    name: Upload macOS release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: yanglao-macos
          path: artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
